    - generic [ref=f1e63]:
      - heading "Yo'nalishlar haqida batafsil" [level=2] [ref=f1e64]
      - article [ref=f1e65]:
        - heading "Arduino asoslari — nima bilan boshlanadi?" [level=3] [ref=f1e66]
        - paragraph [ref=f1e67]: Birinchi mashg'ulotda Arduino Uno platasini kompyuterga ulash va «Blink» sketchini yuklash o'rganiladi. Keyingi darslarda LED, harakat sensori (PIR), harorat va namlik sensorlari bilan ishlash, servo motor boshqaruvi mashq qilinadi.
        - paragraph [ref=f1e68]: Semestr yakunida guruh line-follower robotni yig'adi va «Arduino Cup» musobaqasida ishtirok etadi.
        - paragraph [ref=f1e69]: "Nazorat loyihasi: avtomatlashtirilgan liniya — 20-ball"
      - article [ref=f1e70]:
        - heading "3D-printer va prototiplash — qo'lda boshlanadi" [level=3] [ref=f1e71]
        - paragraph [ref=f1e72]: Avval qog'ozda chizma, so'ng Fusion 360 da 3D model yasash. Tayyor STL faylni Prusa i3 printerida chop etish parametrlari — qatlam balandligi, infill foizi va templaturasi — alohida mashq sifatida o'rganiladi.
        - paragraph [ref=f1e73]: Semestrliga har bir talaba kamida 3 ta detal chop etadi
