<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaxsiy ma'lumotlar — Ro'yxatdan o'tish</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrapper">

    <!-- Rasm (Image 1 ga o'xshash) -->
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=600&q=80" alt="Image 1" class="login-img">

    <!-- Form -->
    <div class="login-box">
        <h2>Shaxsiy ma'lumotlar</h2>

        <!-- 1. Shaxsiy ma'lumotlar -->
        <div class="form-row">
            <div class="field">
                <label for="fullName">F.I.Sh.</label>
                <input id="fullName" type="text" placeholder="Aliyev Vali Karimovich" required>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="phone">Telefon</label>
                <input id="phone" type="tel" placeholder="+998 90 123 45 67" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="talaba@mail.uz" required>
            </div>
        </div>

        <p style="font-size: .9rem; color: #475569; margin-top: -8px; margin-bottom: 10px;">+998 90 123 45 67</p>

        <div class="form-row">
            <div class="field">
                <label for="gender">Jinsi</label>
                <select id="gender" required>
                    <option value="">Tanlang</option>
                    <option>Erkak</option>
                    <option>Ayol</option>
                </select>
            </div>
            <div class="field">
                <label for="birth">Tug'ilgan sana (ixtiyoriy)</label>
                <input id="birth" type="text" placeholder="mm/dd/yyyy" required>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="password">Parol</label>
                <input id="password" type="password" placeholder="" required>
            </div>
            <div class="field">
                <label for="rePassword">Parolni takrorlang</label>
                <input id="rePassword" type="password" placeholder="" required>
                <small>Kamida 8 belgi</small>
            </div>
        </div>

        <!-- 2. O'qish joyi -->
        <h3 class="section-title">O'qish joyi</h3>

        <div class="form-row">
            <div class="field">
                <label for="faculty">Fakultet</label>
                <select id="faculty" required>
                    <option value="">Tanlang</option>
                    <option>Fizika-matematika fakulteti</option>
                </select>
            </div>
            <div class="field">
                <label for="direction">Yo'nalish</label>
                <select id="direction" required>
                    <option value="">Avval fakultetni tanlang</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="course">Kurs</label>
                <select id="course" required>
                    <option value="">Tanlang</option>
                    <option>1-kurs</option>
                    <option>2-kurs</option>
                    <option>3-kurs</option>
                    <option>4-kurs</option>
                </select>
            </div>
            <div class="field">
                <label for="group">Guruh</label>
                <input id="group" type="text" placeholder="AT-21-01" required>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="studentId">Talaba ID raqami</label>
                <input id="studentId" type="text" placeholder="2210345" required>
                <small>Talabalik quvnomasi yoki HEMIS ID</small>
            </div>
            <div class="field">
                <label for="living">Yashash joyi</label>
                <select id="living" required>
                    <option value="">Tanlang</option>
                    <option>Yotoqxona</option>
                    <option>Ijarada</option>
                    <option>O'z uyim</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn">Ro'yxatdan o'tish</button>
    </div>

</div>

</body>
</html>
